<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090B0E" />
    <meta name="description" content="Full-stack software engineer. Mobile, web, backend and applied AI. 20 products shipped across 2025 and 2026. Based in Saudi Arabia and open to new roles." />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="canonical" href="https://muntazermehdi.com/" />

    <!-- Link previews. og:image must be an absolute URL: LinkedIn, WhatsApp and
         X fetch it from their own servers, where a relative path resolves to
         nothing. Dimensions are declared so the card reserves space before the
         image arrives. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muntazer Mehdi" />
    <meta property="og:url" content="https://muntazermehdi.com/" />
    <meta property="og:title" content="Muntazer Mehdi, Full-Stack Software Engineer" />
    <meta property="og:description" content="App, API, database, and AI when the product needs it. 20 products shipped across 2025 and 2026. In Saudi Arabia on a transferable visa, open to new roles." />
    <meta property="og:image" content="https://muntazermehdi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muntazer Mehdi, Full-Stack Software Engineer. Based in Madinah, Saudi Arabia, on a transferable visa." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muntazer Mehdi, Full-Stack Software Engineer" />
    <meta name="twitter:description" content="App, API, database, and AI when the product needs it. 20 products shipped across 2025 and 2026. In Saudi Arabia on a transferable visa, open to new roles." />
    <meta name="twitter:image" content="https://muntazermehdi.com/og-image.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Muntazer Mehdi, Full-Stack Software Engineer</title>
      <script>
      (function () {
        /* A saved choice wins; otherwise follow the visitor's own system.
           Each read is guarded separately: localStorage throws in some
           privacy modes, and one failure there must not cost a light-mode
           visitor their theme. */
        var t = null, l = null;
        try { t = localStorage.getItem("mm.theme"); } catch (e) {}
        try { l = localStorage.getItem("mm.lens"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          try {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } catch (e) { t = "dark"; }
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.lens = l || "fullstack";
        /* must equal --paper, or the pre-paint fill seams against the page */
        document.documentElement.style.background = t === "dark" ? "#090B0E" : "#F7F7F5";
      })();
    </script>
  </head>
